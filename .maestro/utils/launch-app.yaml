appId: ${APP_ID}
tags:
  - util
---
# Relaunch without wiping data; flows that need a fresh install call
# clear-state.yaml first.
- launchApp
- openLink: exp+mull://expo-development-client/?url=${METRO_URL}
# The dev client shows its developer menu once after a fresh connection.
- extendedWaitUntil:
    visible: 'Continue'
    timeout: 30000
    optional: true
- runFlow:
    when:
      visible: 'Continue'
    commands:
      - tapOn: 'Continue'
- runFlow:
    when:
      visible:
        id: 'xmark'
    commands:
      - tapOn:
          id: 'xmark'
